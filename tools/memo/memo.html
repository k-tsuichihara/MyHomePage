<!DOCTYPE html>
<html lang="ja" class="scroll-hidden">

<!--ヘッダー-->
<head>
<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>メモ</title>
	<meta name="description" content="Tools - メモ">
	<meta name="keywords" content="">
	<meta name="author" content="Kana Tsuichihara">

	<!--Bootstrap-->
	<link href="../../css/style.css" rel="stylesheet" type="text/css">
	<link href="../../css/bootstrap-4.0.0.css" rel="stylesheet">
	<link href="css/memo.css" rel="stylesheet" type="text/css">
	
</head>
<body>
	<header>
        <div id="tool-header">
            <a href="../index.html" class="site-brand">
                <span class="brand-name">Kana Tsuichihara</span>
                <span class="brand-subtitle">Portfolio</span>
            </a>
            <div class="tool-name">メモツール</div>
        </div>
	</header>
	<main>
		<section class="memo-page" aria-labelledby="memo-title">
			<div class="memo-shell">
				<div class="memo-header">
					<h1 id="memo-title">メモ</h1>
					<p>簡単なメモツールです。入力した内容は端末（ブラウザ）に自動保存されます。</p>
                    <p>ほかの端末やブラウザが異なる場合は保存したメモは開けません。</p>
				</div>
				<form id="memo-form" class="memo-form">
					<label for="title">タイトル</label>
					<input type="text" id="title" placeholder="タイトル">
					<label for="memo-text">本文</label>
					<textarea id="memo-text" name="memoText" rows="6" maxlength="500" placeholder="本文"></textarea>
					<div class="memo-form-actions">
						<button type="submit" id="memo-submit-btn">追加</button>
						<button type="button" id="memo-cancel-btn" hidden>編集キャンセル</button>
					</div>
				</form>

				<div class="memo-list-header">
					<h2>保存済みメモ</h2>
					<button type="button" id="memo-clear-all-btn" class="danger">すべて削除</button>
				</div>

				<ul id="memo-list" class="memo-list"></ul>
				<p id="memo-empty" class="memo-empty">メモはまだありません。</p>
			</div>
		</section>
    </main>
	<footer>
		<div id="obi">
			<div class="footer-content">
				<div class="footer-title">Kana Tsuichihara Portfolio</div>
				<div class="footer-tagline">Learning by building</div>
			</div>
		</div>
	</footer>
<script src="../../js/jquery-3.5.0.min.js"></script>
<script src="../../js/popper.min.js"></script>
<script src="../../js/menuScroll.js"></script>
<script src="../../js/shared-menu.js?v=20260411-3" data-root=".."></script>
<script src="js/memo.js"></script>
</body>
</html>
